name: PHP

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: hendricks_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOSTNAME: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: test
      DB_NAME: hendricks_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, xml, zip, mysqli
          coverage: none
      - name: Abhängigkeiten
        run: composer install --no-interaction --prefer-dist
      - name: Syntaxprüfung
        run: |
          php -l index.php
          find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: vendor/bin/phpunit
